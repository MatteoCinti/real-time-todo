mutation UpdateTodo(
  $id: Int!
  $title: String
  $description: String
  $isDone: Boolean
  $order: Int
  $parentId: Int
) {
  updateTodo(
    id: $id
    title: $title
    description: $description
    isDone: $isDone
  ) {
    id
    title
    description
    isDone
    order
    parentId
  }
}
